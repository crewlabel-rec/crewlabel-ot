<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="theme-color" content="#1C1C1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<title>크루레이블 OT 큐카드 — 오프닝</title>
<style>
  @font-face {
    font-family: 'GmarketSans';
    src: url('https://crewlabel-rec.github.io/font/GMARKETSANSTTFMEDIUM.TTF') format('truetype');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'GmarketSans';
    src: url('https://crewlabel-rec.github.io/font/GMARKETSANSTTFBOLD.TTF') format('truetype');
    font-weight: 700;
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1c1c1e;
    font-family: 'GmarketSans', -apple-system, sans-serif;
  }

  .stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3.5vh 6vw 0;
    flex-shrink: 0;
  }

  .card-label {
    font-size: 26px;
    font-weight: 600;
    color: #c9c9cd;
    letter-spacing: 0.02em;
  }

  .dots {
    display: flex;
    gap: 9px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #444448;
    transition: background 0.2s;
  }
  .dot.active { background: #f5f5f0; }

  .main {
    flex: 1;
    overflow-y: auto;
    padding: 2.5vh 6vw 3vh;
    display: flex;
    flex-direction: column;
  }

  .main-inner {
    margin: auto 0;
  }

  .section + .section {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid #2c2c2e;
  }

  .title-text {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.5;
    color: #f5f5f0;
    margin-bottom: 18px;
  }

  .script-body {
    font-size: 25px;
    line-height: 1.85;
    color: #c9c9cd;
    font-weight: 500;
    white-space: pre-line;
  }

  .qline {
    color: #5ec8f2;
  }

  .stagecue {
    color: #a8f0d0;
    font-style: italic;
    font-weight: 600;
  }

  .pronounce {
    color: #ff2d3a;
    font-weight: 700;
  }

  .slide-cue {
    color: #ffffff;
    font-style: italic;
    font-weight: 700;
    font-size: 30px;
  }

  .section-tag {
    color: #5ec8f2;
  }

  .watch-label {
    color: #fff275;
    font-style: italic;
    font-weight: 700;
    font-size: 30px;
    display: block;
  }

  .kakao-card {
    background: #2a2a2d;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0;
    font-size: 22px;
    color: #e8e8ea;
    line-height: 1.6;
  }

  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
  }

  .choice-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: #232326;
    border: 0.5px solid #38383c;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 20px;
    color: #c9c9cd;
    line-height: 1.5;
  }

  .choice-num {
    color: #a8f0d0;
    font-weight: 700;
    min-width: 18px;
  }

  .note-box {
    background: rgba(196,138,90,0.12);
    border-left: 3px solid #d9a679;
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    margin: 0;
  }

  .note-label {
    font-size: 13px;
    color: #d9a679;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .agenda-label {
    font-size: 30px;
    color: #f2b866;
    font-weight: 700;
    margin: 0;
  }

  .note-body {
    font-size: 18px;
    color: #c9b699;
    line-height: 1.5;
  }

  .highlight {
    color: #f5f5f0;
    font-weight: 700;
  }

  .top-row-left {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .part-label {
    font-size: 30px;
    font-weight: 700;
    color: #a8f0d0;
    letter-spacing: 0.01em;
  }

  .top-sep {
    color: #444448;
    font-size: 30px;
  }

  .flow-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
    font-size: 25px;
    font-weight: 500;
    color: #c9c9cd;

  .flow-list li { display: flex; align-items: baseline; gap: 12px; }
  .flow-list .num { color: #6b6b70; font-weight: 700; min-width: 24px; }

  .mode-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.02em;

  .mode-bar.briefing { background: rgba(122,146,165,0.14); color: #9fb3c2; }
  .mode-bar.ppt { background: rgba(196,138,90,0.14); color: #d9a679; }
  .mode-bar.mixed { background: linear-gradient(90deg, rgba(122,146,165,0.16), rgba(196,138,90,0.16)); color: #c9b699; }

  .bottom-bar {
    display: flex;
    height: 9.5vh;
    min-height: 70px;
    border-top: 1px solid #2c2c2e;
    flex-shrink: 0;
  }

  .nav-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #9a9a9f;
    font-family: inherit;
    font-size: 18px;
    font-weight: 500;
    transition: background 0.15s;
  }
  .nav-zone:active { background: rgba(255,255,255,0.06); }
  .nav-zone svg { width: 26px; height: 26px; }
  #prevBtn { border-right: 1px solid #2c2c2e; }

  .cover {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #1c1c1e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 8vh 8vw;
    cursor: pointer;
  }

  .cover-logo {
    width: min(72vw, 480px);
    height: auto;
  }

  .cover-title {
    font-size: 34px;
    font-weight: 700;
    color: #f5f5f0;
    text-align: center;
    line-height: 1.4;
  }

  .cover-sub {
    font-size: 16px;
    font-weight: 500;
    color: #9a9a9f;
    text-align: center;
    letter-spacing: 0.03em;
  }

  .cover-hint {
    position: absolute;
    bottom: 6vh;
    font-size: 14px;
    color: #6b6b70;
  }
</style>
</head>

</div>

        script: "<span class=\"stagecue\">(오프닝: 크루레이블 오프닝 BGM + 진행자 멘트)</span>\n\n오늘의 주제는 '남자들이 좋아하는 카톡은 무엇일까?' 입니다.\n\n썸에서 뭔가 진전이 잘 안 되고 항상 끝난다면, 물론 여러 가지 이유가 있을 수 있지만 혹시 카톡에 문제가 있었던 것은 아닐까 한번 생각해보자는 취지에서 준비했습니다. 보통 남자들이 좋아하는 카톡 답변이 따로 있더라고요. 여기 크루레이블 멤버들은 어떤 카톡을 좋아하는지 궁금해서 준비했습니다.\n\n제가 상황과 카톡 내용을 이야기하면, 먼저 여자분들이 남자가 좋아할 것 같은 답을 골라주시고, 뒤이어 남자분들도 골라주시면 됩니다.\n\n<div class=\"agenda-label\">아젠다A — 소개팅 전, 약속 정하기</div>\n\n상황은 소개팅 전, 아직 안 만난 거예요. 약속 정할 때입니다.\n\n<div class=\"kakao-card\">\"안녕하세요 OO씨\"<br>\"오늘 저녁 잊지 않으셨죠?\"<br>\"혹시 특별히 드시고 싶으신 거 있나요?\"</div>\n\n자, 여기에 대한 소개팅녀의 답변입니다. 골라보세요.\n\n<div class=\"choice-list\">\n<div class=\"choice-item\"><span class=\"choice-num\">1</span>\"아! 예약 안 하셨어요? 제가 예약하고 장소 알려드릴게요\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">2</span>\"네 그럼요, 전 아무거나 좋아요\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">3</span>\"그럼요 당연히 기억하고 있죠! 뭐 먹을지는 만나서 정할까요?\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">4</span>\"네 그럼요, 저는 다 잘 먹긴 하는데 고기를 좋아해요\"</div>\n</div>\n\n여성 크루분들이 먼저 한 명씩 고르고 이유를 말해주시면 됩니다. 누구부터 할까요?\n\n<div class=\"note-box\"><div class=\"note-label\">진행 메모</div><div class=\"note-body\">답변 종료 후, 남성 크루분들도 한 명씩 고르고 이유를 물어본다</div></div>\n\n실제로 남자들이 첫 만남 때는 특히나 데이트 메뉴를 고르는 데 신경이 쓰인다고 합니다.\n\n<div class=\"note-box\"><div class=\"note-label\">진행 메모</div><div class=\"note-body\">계속 받아서 출연자들의 경험담·지인 사연이 나오게 유도한다. 유도하지 않아도 첫 시뮬레이션에서 바로 멘트를 받는 사람은 기억해둔다 — 이후 활약상이 기대되기 때문이다</div></div>\n\n<span class=\"highlight\">마무리: 남자들이 첫 만남 전에 어떤 메뉴를 고를지 선택의 폭을 줄여주는 게 좋다고 합니다.</span>\n\n<div class=\"agenda-label\">아젠다B — 술자리 취향 묻기</div>\n\n<div class=\"kakao-card\">\"혹시 술은 잘 드세요?\"<br>\"주종은 어떤 걸 좋아하시나요?\"</div>\n\n<div class=\"choice-list\">\n<div class=\"choice-item\"><span class=\"choice-num\">1</span>\"네 못 먹지는 않죠! 저는 와인 아니면 소주가 좋습니다\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">2</span>\"저 술은 잘 못하긴 하는데, OO씨랑 먹으면 조금 먹을 수 있을 것 같아요\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">3</span>\"그렇게 잘 마시진 않지만, 분위기 맞출 정도는 마셔요. 소맥 좋아해요\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">4</span>\"아! 오늘 달리는 건가요? ㅋㅋㅋㅋ 저는 다 괜찮은데 OO씨는 뭐 좋아해요?\"</div>\n</div>\n\n여성 크루분들, 남성분들, 순서대로 남자들은 어떤 답변을 좋아할지 골라주세요.\n\n<div class=\"note-box\"><div class=\"note-label\">진행 메모</div><div class=\"note-body\">경험담 또는 지인 사연담 유도 → 전체 의견 듣고 MC 결론 도출</div></div>\n\n<div class=\"agenda-label\">아젠다C — 소개팅 후 재만남 제안</div>\n\n자, 이제 조금 어려워집니다. 소개팅 후 남자의 카톡입니다.\n\n<div class=\"kakao-card\">\"오늘 너무 즐거웠습니다\"<br>\"한번 더 뵙고 싶은데.. 이번 주 시간 어떠세요?\"</div>\n\n<div class=\"choice-list\">\n<div class=\"choice-item\"><span class=\"choice-num\">1</span>\"이번 주는 선약이 있어서요.. 다음 주 토요일은 괜찮아요\" <span style=\"color:#6b6b70;\">(한 스텝 튕김)</span></div>\n<div class=\"choice-item\"><span class=\"choice-num\">2</span>\"저도 너무 즐거웠어요, 그럼 이번 주 토요일 어떠세요?\" <span style=\"color:#6b6b70;\">(솔직한 스타일)</span></div>\n<div class=\"choice-item\"><span class=\"choice-num\">3</span>\"저야말로 시간 가는 줄 몰랐네요! 다음 주 금요일이나 토요일 만날까요?\" <span style=\"color:#6b6b70;\">(스케줄상 미루는 느낌)</span></div>\n<div class=\"choice-item\"><span class=\"choice-num\">4</span>\"오! 좋아요, 저는 아무 때나 콜이에요\" <span style=\"color:#6b6b70;\">(저 세상 텐션)</span></div>\n</div>\n\n<div class=\"note-box\"><div class=\"note-label\">진행 메모</div><div class=\"note-body\">경험담 유도 → 전체 의견 듣고 MC 결론 도출</div></div>\n\n<div class=\"agenda-label\">아젠다D — 썸남의 칭찬</div>\n\n<div class=\"kakao-card\">\"그런데 남자들한테 인기 많으실 것 같아요\"</div>\n\n<div class=\"choice-list\">\n<div class=\"choice-item\"><span class=\"choice-num\">1</span>\"없지는 않죠 ㅋㅋㅋㅋㅋ\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">2</span>\"저 남사친 하나도 없는데.. 인기 하나도 없어요\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">3</span>\"아~ 그래 보이나요? 칭찬이죠? 고마워요~\"</div>\n<div class=\"choice-item\"><span class=\"choice-num\">4</span>\"에이~ 아니에요~ 제가 보기엔 OO씨가 더 인기 많으실 것 같은데\"</div>\n</div>\n\n실제로 많은 남성분들이 고른 답변은 <span class=\"highlight\">\"저 남사친 하나도 없는데.. 인기 하나도 없어요\"</span>였어요. 센스 있는 여자의 답변도 하나 소개하면: <span class=\"highlight\">\"인기 없진 않지만 남자랑은 친구 안 해요\"</span>\n\n<div class=\"agenda-label\">마무리</div>\n\n1. 남자가 질문을 던졌을 때, 다시 남자한테 똑같은 질문을 던져주면서 의사를 물어보는 거, 나쁘지 않다고 합니다.\n2. 선택권의 폭을 남자에게 확 줄여주는 게 진짜 고맙다고 합니다.\n\n<div class=\"note-box\"><div class=\"note-label\">운영 메모</div><div class=\"note-body\">섹션01이 너무 빨리 끝나면 섹션02로 이어간다. 충분히 분량이 나오면 섹션01로 마무리한다</div></div>"

        script: "<span class=\"stagecue\">(오프닝: 크루레이블 오프닝 BGM + 진행자 멘트를 출연자 한 명이 자원·지목으로 직접 진행)</span>\n\n오늘의 주제는 '스킨십에 대한 남녀 차이', 이 차이는 왜 존재하는가?\n\n<div class=\"agenda-label\">아젠다A — 도끼병</div>\n\n도끼병은 남자가 더 많을까요? 여자가 더 많을까요?\n\n<div class=\"note-box\"><div class=\"note-label\">진행 메모</div><div class=\"note-body\">출연자들의 대답에 따라 이유를 꼭 물어본다</div></div>\n\n답은, 진화심리학적 관점에서 봤을 때 남자가 더 많다고 합니다. 여자가 남자의 팔을 잡았다고 생각해보면, 남자는 크게 2가지 착각을 할 수 있습니다.\n\n<div class=\"choice-list\">\n<div class=\"choice-item\"><span class=\"choice-num\">①</span>여자가 관심 없는데 있다고 착각 — 불이익은 거의 없음 (고백했다가 거절당하는 창피함 정도)</div>\n<div class=\"choice-item\"><span class=\"choice-num\">②</span>여자가 관심 있는데 없다고 착각 — 불이익이 큼 (좋아했던 사람을 그대로 놓침)</div>\n</div>\n\n그래서 ②번 착각을 하는 남자들의 DNA는 점점 적게 남고, ①번 착각을 하는 남자들의 DNA는 점점 많이 남게 되었다 — 진화론적으로 남자가 여자보다 도끼병이 많을 수밖에 없다는 결론입니다. 여자는 임신·출산·육아라는 기간이 있어서 횟수와 DNA의 상관관계가 남자만큼 크지 않고요.\n\n<span class=\"highlight\">그래서 남자는 낯선 여자의 스킨십을 호의적으로 받아들이기 쉽다는 겁니다.</span>\n\n관련 실험도 있는데요, 남녀 참가자에게 각각 이성 스태프를 붙이고 스킨십 유무에 따른 호감도를 측정했더니, 남성은 스킨십 시 호감도가 크게 올랐고 여성은 오히려 낮아졌다고 합니다. \"이래서 여자들이 매너손에 환장하는 거다\"라는 겁니다.\n\n<div class=\"note-box\"><div class=\"note-label\">진행 메모</div><div class=\"note-body\">출연자들의 생각과 대화 유도</div></div>\n\n<div class=\"agenda-label\">아젠다B — 자유 경험담</div>\n\n아직 친하지 않은 낯선 이성의 스킨십 중에서 심쿵했던 것, 혹은 반대로 아니었던 것 있나요?\n\n<div class=\"agenda-label\">아젠다C — 마무리 자유 토크</div>\n\n마음에 드는 이성에게 내가 잘하는 스킨십, 또는 내가 본 특이한 스킨십이 있을까요?"

let idx = 0;

const cardLabel = document.getElementById('cardLabel');
const partLabel = document.getElementById('partLabel');
const mainArea = document.getElementById('mainArea');
const dots = document.getElementById('dots');
const modeBar = document.getElementById('modeBar');

function render() {
  const p = pages[idx];
  cardLabel.textContent = p.label;
  partLabel.textContent = p.part;
  mainArea.scrollTop = 0;

  modeBar.className = 'mode-bar ' + p.mode;
  modeBar.textContent = p.mode === 'ppt' ? 'PPT 구간 · 뒤쪽 모니터 설명' : p.mode === 'mixed' ? '브리핑 · PPT 혼합 구간' : '브리핑 구간 · 정면 응대';

  const sectionsHtml = p.sections.map(s => {
    const scriptHtml = s.script ? `<div class="script-body">${s.script}</div>` : '';
    const flowHtml = s.flowItems
      ? '<ol class="flow-list">' + s.flowItems.map((item, i) => `<li><span class="num">${i+1}</span>${item}</li>`).join('') + '</ol>'
      : '';
    const body = scriptHtml + flowHtml;
    const titleHtml = s.title ? `<div class="title-text">${s.title}</div>` : '';
    return `<div class="section">${titleHtml}${body}</div>`;
  }).join('');
  mainArea.innerHTML = `<div class="main-inner">${sectionsHtml}</div>`;

  dots.innerHTML = '';
  pages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === idx ? ' active' : '');
    dots.appendChild(d);
  });
}

document.getElementById('prevBtn').addEventListener('click', () => {
  idx = (idx - 1 + pages.length) % pages.length;
  render();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  idx = (idx + 1) % pages.length;
  render();
});

render();

document.getElementById('coverScreen').addEventListener('click', function() {
  this.style.display = 'none';
});

if (window.matchMedia('(display-mode: standalone)').matches) {
  document.addEventListener('click', function fullscreenOnce() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    }
    document.removeEventListener('click', fullscreenOnce);
  });
}
</script>
